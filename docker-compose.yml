services:
  app:
    build: .
    # Or, once you publish an image:
    # image: ghcr.io/you/cal-ai-web:latest
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      # Required. Generate the secret with: openssl rand -base64 32
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      APP_PASSWORD: ${APP_PASSWORD:?set APP_PASSWORD in .env}

      # Optional — enables photo scanning and natural-language logging.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-opus-5}
      PHOTO_MAX_EDGE: ${PHOTO_MAX_EDGE:-1568}

      # Optional — server-side speech-to-text for voice logging.
      STT_ENDPOINT: ${STT_ENDPOINT:-}
      STT_API_KEY: ${STT_API_KEY:-}
      STT_MODEL: ${STT_MODEL:-whisper-1}

      # Open Food Facts asks every client to identify itself.
      OFF_CONTACT_EMAIL: ${OFF_CONTACT_EMAIL:-selfhosted@example.org}

      DATABASE_PATH: /data/db/app.db
      UPLOAD_DIR: /data/uploads

    volumes:
      # Mount the DIRECTORY, never the .db file. WAL mode creates app.db-wal and
      # app.db-shm beside it; bind-mounting the single file puts those sidecars
      # on the container's ephemeral layer and corrupts the database on restart.
      - calai-data:/data

volumes:
  calai-data:
