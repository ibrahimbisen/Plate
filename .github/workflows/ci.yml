name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npx tsx tests/metrics.test.ts

      - name: Build
        run: npm run build

      # Guards vercel/next.js#88844: a Turbopack standalone build silently omits
      # serverExternalPackages, producing an image that dies at boot. The build
      # script pins --webpack; this asserts the pin is still doing its job.
      - name: Assert native modules reached the standalone output
        run: |
          for pkg in better-sqlite3 sharp; do
            if [ ! -d ".next/standalone/node_modules/$pkg" ]; then
              echo "::error::$pkg missing from .next/standalone/node_modules"
              exit 1
            fi
          done
          echo "native modules present"

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
